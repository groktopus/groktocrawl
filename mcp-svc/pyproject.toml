[project]
name = 'mcp-svc'
version = '0.3.0'
description = 'MCP server for GroktoCrawl — exposes all tools via Model Context Protocol'
requires-python = '>=3.12'
dependencies = [
    'mcp==1.27.0',
    'httpx==0.28.1',
    'pydantic==2.11.4',
    'uvicorn[standard]==0.34.3',
]

[tool.setuptools]
py-modules = [
    'browser_handler',
    'groktocrawl_client',
    'mcp_server',
    'pagination',
    'session_store',
]

[tool.deptry.per_rule_ignores]
# Uvicorn is the container entry point. Pydantic is pinned explicitly to satisfy
# mcp==1.27.0's pydantic>=2.11.0,<3.0.0 compatibility constraint.
DEP002 = ['uvicorn', 'pydantic']

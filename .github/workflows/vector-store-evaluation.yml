name: Vector Store Evaluation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional stable identifier for the isolated fixture run
        required: false
        type: string
      rounds:
        description: Repeated warm rounds after provider initialization
        required: false
        default: "3"
        type: string
      fresh_each_round:
        description: Recreate provider resources for every round
        required: false
        default: false
        type: boolean
      concurrency_workers:
        description: Independent clients for the optional mixed workload (0 disables it)
        required: false
        default: "0"
        type: string
      concurrency_operations:
        description: Total mixed operations per provider when concurrency is enabled
        required: false
        default: "40"
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Compare Qdrant and pgvector
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: groktocrawl-x-vector-eval-${{ github.run_id }}
      VECTOR_EVAL_POSTGRES_PASSWORD: vector-eval-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v5

      - name: Validate isolated Compose file
        run: docker compose -f compose.vector-evaluation.yml --profile vector-eval config --quiet

      - name: Start isolated vector services
        run: docker compose -f compose.vector-evaluation.yml --profile vector-eval up -d --wait

      - name: Run comparison harness
        env:
          VECTOR_EVAL_RUN_ID: ${{ inputs.run_id }}
          VECTOR_EVAL_ROUNDS: ${{ inputs.rounds }}
          VECTOR_EVAL_FRESH_EACH_ROUND: ${{ inputs.fresh_each_round }}
          VECTOR_EVAL_CONCURRENCY_WORKERS: ${{ inputs.concurrency_workers }}
          VECTOR_EVAL_CONCURRENCY_OPERATIONS: ${{ inputs.concurrency_operations }}
        run: |
          mkdir -p vector-evaluation-out
          qdrant_container=$(docker compose -f compose.vector-evaluation.yml --profile vector-eval ps -q vector-eval-qdrant)
          eval_network=$(docker inspect "$qdrant_container" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          echo "::add-mask::$VECTOR_EVAL_POSTGRES_PASSWORD"
          runner=$(docker run -d --network bridge \
            -e VECTOR_EVAL_POSTGRES_PASSWORD \
            -e VECTOR_EVAL_RUN_ID \
            -e VECTOR_EVAL_ROUNDS \
            -e VECTOR_EVAL_FRESH_EACH_ROUND \
            -e VECTOR_EVAL_CONCURRENCY_WORKERS \
            -e VECTOR_EVAL_CONCURRENCY_OPERATIONS \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/vector-evaluation-out:/out" \
            -w /workspace python:3.12-slim sleep 600)
          cleanup_runner() {
            docker rm -f "$runner" >/dev/null 2>&1 || true
          }
          trap cleanup_runner EXIT
          docker network connect "$eval_network" "$runner"
          docker exec "$runner" sh -ceu '
            python -m pip install --disable-pip-version-check --no-cache-dir \
              "psycopg[binary]==3.3.5" "qdrant-client>=1.13.0,<1.20.0"
            fresh_args=""
            if [ "${VECTOR_EVAL_FRESH_EACH_ROUND:-false}" = "true" ]; then
              fresh_args="--fresh-each-round"
            fi
            concurrency_args=""
            if [ "${VECTOR_EVAL_CONCURRENCY_WORKERS:-0}" -gt 0 ]; then
              concurrency_args="--concurrency-workers ${VECTOR_EVAL_CONCURRENCY_WORKERS} --concurrency-operations ${VECTOR_EVAL_CONCURRENCY_OPERATIONS}"
            fi
              if [ -n "${VECTOR_EVAL_RUN_ID:-}" ]; then
                python scripts/run_vector_store_evaluation.py \
                  --qdrant-url http://vector-eval-qdrant:6333 \
                  --postgres-dsn "postgresql://vector_eval:${VECTOR_EVAL_POSTGRES_PASSWORD}@vector-eval-postgres:5432/vector_eval" \
                  --allow-isolated-database \
                  --cleanup \
                  --rounds "$VECTOR_EVAL_ROUNDS" \
                  --run-id "$VECTOR_EVAL_RUN_ID" \
                  $fresh_args \
                  $concurrency_args \
                  --output /out/evaluation.json
              else
                python scripts/run_vector_store_evaluation.py \
                  --qdrant-url http://vector-eval-qdrant:6333 \
                  --postgres-dsn "postgresql://vector_eval:${VECTOR_EVAL_POSTGRES_PASSWORD}@vector-eval-postgres:5432/vector_eval" \
                  --allow-isolated-database \
                  --cleanup \
                  --rounds "$VECTOR_EVAL_ROUNDS" \
                  $fresh_args \
                  $concurrency_args \
                  --output /out/evaluation.json
              fi
            '

      - name: Enforce fixture gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("vector-evaluation-out/evaluation.json").read_text())
          assert result["decision"] == "evaluation_only"
          assert result["production_change"] is False
          assert result["qdrant_removal"] is False
          for candidate in result["candidates"]:
              assert candidate["ok"], candidate
              assert all(candidate["gates"].values()), candidate
          print("fixture gates passed for", [c["name"] for c in result["candidates"]])
          PY

      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vector-store-evaluation-${{ github.run_id }}
          path: vector-evaluation-out/
          if-no-files-found: warn

      - name: Stop isolated vector services
        if: always()
        run: docker compose -f compose.vector-evaluation.yml --profile vector-eval down --volumes --remove-orphans --timeout 30

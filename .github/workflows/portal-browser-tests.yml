name: Portal Browser Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-svc/portal/templates/**'
      - 'tests/browser/**'
      - '.github/workflows/portal-browser-tests.yml'
  push:
    branches: [main]
    paths:
      - 'portal-svc/portal/templates/**'
      - 'tests/browser/**'
      - '.github/workflows/portal-browser-tests.yml'

permissions:
  contents: read

jobs:
  portal-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev --group fast-tests
      - run: uv run --no-sync playwright install --with-deps firefox chromium
      - name: Verify Firefox and Chromium submissions
        run: uv run --no-sync pytest tests/browser/test_portal_submission.py --no-cov -n 0

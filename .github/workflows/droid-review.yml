name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assess-depth:
    runs-on: ubuntu-latest
    outputs:
      depth: ${{ steps.check.outputs.depth }}
      security: ${{ steps.check.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || git diff --name-only HEAD~1)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qiE '(auth|oauth|jwt|saml|password|api.?key|secret|token|credential|crypt|cert|ssl|tls|firewall|proxy|dockerfile|docker-compose|kubernetes|k8s|terraform|\.env|config\.|sudo|exec|eval|spawn|cve|exploit)'; then
            echo "depth=deep" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
          else
            echo "depth=shallow" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
          fi

  droid-review:
    needs: assess-depth
    if: github.event.pull_request.draft == false && github.actor != 'app/dependabot' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # BYOM review model: droid exec resolves "custom:" model references from
      # ~/.factory/settings.json on the runner. The API key is exported via
      # GITHUB_ENV and referenced as ${DEEPSEEK_API_KEY} so the raw key never
      # lands in the settings file (the action uploads ~/.factory/** as a debug
      # artifact). Add the DEEPSEEK_API_KEY secret in the repo/org settings.
      - name: Configure BYOM review model
        shell: bash
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'EOF'
          {
            "customModels": [
              {
                "model": "deepseek-v4-flash",
                "displayName": "DeepSeek V4 Flash",
                "baseUrl": "https://api.deepseek.com/v1",
                "apiKey": "${DEEPSEEK_API_KEY}",
                "provider": "generic-chat-completion-api",
                "noImageSupport": true
              }
            ]
          }
          EOF
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@2041e7cc36d1390346bdaa6616e4bf7ac6b96b27
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          review_depth: ${{ needs.assess-depth.outputs.depth }}
          review_model: custom:DeepSeek-V4-Flash-0
          security_model: custom:DeepSeek-V4-Flash-0
          automatic_security_review: ${{ needs.assess-depth.outputs.security }}
          allowed_bots: "dependabot[bot]"

name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assess-depth:
    runs-on: ubuntu-latest
    outputs:
      depth: ${{ steps.check.outputs.depth }}
      security: ${{ steps.check.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || git diff --name-only HEAD~1)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qiE '(auth|oauth|jwt|saml|password|api.?key|secret|token|credential|crypt|cert|ssl|tls|firewall|proxy|dockerfile|docker-compose|kubernetes|k8s|terraform|\.env|config\.|sudo|exec|eval|spawn|cve|exploit)'; then
            echo "depth=deep" >> $GITHUB_OUTPUT
            echo "security=true" >> $GITHUB_OUTPUT
          else
            echo "depth=shallow" >> $GITHUB_OUTPUT
            echo "security=false" >> $GITHUB_OUTPUT
          fi

  droid-review:
    needs: assess-depth
    # Fork gate hygiene (#562 round 2): mirrors docker.yml's integration-lane
    # gate (PR #605). GHA loose equality coerces Null->0 and Boolean false->0,
    # so the previous raw `head.repo.fork == false` evaluated TRUE for deleted
    # forks (null) and admitted them onto automated AI review — low impact on
    # this hosted, review-only lane, but it was the last raw-comparison fork
    # gate under .github/workflows/. Direct expression arithmetic cannot
    # separate null from false (both coerce to 0), so PR admission requires the
    # STRING rendering to equal 'false' (format('{0}', ...) yields
    # 'true'/'false'/'' for null; a missing head.repo property also renders
    # ''). Deleted forks therefore fail closed OFF review.
    #
    # The explicit workflow_dispatch branch preserves manual runs of this
    # workflow (its own declared trigger): on dispatch events the entire
    # pull_request context is null, so under the OLD loose comparisons the job
    # ran — keep that behavior instead of silently dropping the trigger.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'app/dependabot' &&
      format('{0}', github.event.pull_request.head.repo.fork) == 'false') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout pinned Droid action
        uses: actions/checkout@v7
        with:
          repository: Factory-AI/droid-action
          ref: 9be8880c219c3e9341b8dfe235a33359ba1f062e
          path: .github/actions/droid-action
          persist-credentials: false
      # This upstream revision adds deterministic publication after validation.
      # Its built-in debug artifact includes ~/.factory, where Droid resolves
      # model API keys, so remove the two debug artifact steps fail-closed.
      - name: Disable credential-bearing Droid debug artifacts
        shell: bash
        run: |
          python3 - "$GITHUB_WORKSPACE/.github/actions/droid-action" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          action = Path(sys.argv[1])
          expected = "9be8880c219c3e9341b8dfe235a33359ba1f062e"
          actual = subprocess.check_output(
              ["git", "-C", str(action), "rev-parse", "HEAD"], text=True
          ).strip()
          if actual != expected:
              raise SystemExit(f"Unexpected Droid action revision: {actual}")

          action_file = action / "action.yml"
          contents = action_file.read_text()
          collect = "    - name: Collect .factory debug files\n"
          upload = "    - name: Upload debug artifacts\n"
          if contents.count(collect) != 1 or contents.count(upload) != 1:
              raise SystemExit("Droid debug artifact steps changed; refusing to run")
          collect_at = contents.index(collect)
          upload_at = contents.index(upload)
          if upload_at <= collect_at:
              raise SystemExit("Droid debug artifact steps are out of order")
          tail = contents[collect_at:]
          if not tail.rstrip().endswith("retention-days: 7"):
              raise SystemExit("Droid action changed after its debug artifact steps")
          safe_contents = contents[:collect_at].rstrip() + "\n"
          if "name: Post review" not in safe_contents:
              raise SystemExit("Droid deterministic review publisher is missing")
          if "name: Update comment with job link" not in safe_contents:
              raise SystemExit("Droid tracking comment publisher is missing")
          if "actions/upload-artifact" in safe_contents:
              raise SystemExit("Unexpected Droid artifact upload step; refusing to run")
          action_file.write_text(safe_contents)
          PY
      # BYOM review model: droid exec resolves "custom:" model references from
      # ~/.factory/settings.json on the runner. Factory expands the literal
      # ${NOUS_API_KEY} reference from the action-step environment. The raw
      # key is resolved by Droid at runtime.
      # GPT-6 Luna's Chat Completions tool calls require reasoning_effort=none.
      - name: Configure BYOM review model
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'EOF'
          {
            "customModels": [
              {
                "model": "openai/gpt-6-luna",
                "displayName": "Nous-GPT-6-Luna",
                "baseUrl": "https://inference-api.nousresearch.com/v1",
                "apiKey": "${NOUS_API_KEY}",
                "provider": "generic-chat-completion-api",
                "noImageSupport": true,
                "extraArgs": {
                  "reasoning_effort": "none"
                }
              }
            ]
          }
          EOF
      - name: Run Droid Auto Review
        uses: ./.github/actions/droid-action
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          review_depth: ${{ needs.assess-depth.outputs.depth }}
          review_model: custom:Nous-GPT-6-Luna-0
          security_model: custom:Nous-GPT-6-Luna-0
          automatic_security_review: ${{ needs.assess-depth.outputs.security }}
          allowed_bots: "dependabot[bot]"
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      - name: Remove Droid runner state
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/.factory" "$RUNNER_TEMP/.factory" "$RUNNER_TEMP/droid-prompts"

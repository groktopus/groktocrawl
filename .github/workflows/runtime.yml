  protected-capture-composition:
    name: Protected Capture Boundary Composition
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.requires_full_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: compose.experimental-candidate.yml:compose.protected-flare-ci.yml:compose.protected-capture-ci.yml
      COMPOSE_PROFILES: protected-flare,protected-capture
      COMPOSE_PROJECT_NAME: protected-capture-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_POSTGRES_PASSWORD_FILE: /tmp/protected-capture-password-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_API_KEY: ci-only-api-key
      LLM_BASE_URL: http://candidate-llm:8011/v1
      LLM_API_KEY: ci-only-llm-key
      CANDIDATE_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create isolated Compose secret placeholder and validate topology
        run: |
          umask 077
          printf 'ci-only-password\n' > "$CANDIDATE_POSTGRES_PASSWORD_FILE"
          docker compose config --quiet
      - name: Build and start the isolated service composition
        run: >-
          docker compose up --build --detach --wait
          candidate-scraper candidate-private-sentinel candidate-capture-peer-sentinel
          candidate-host-bridge-sentinel candidate-llm
          candidate-scraper-ingress candidate-flare-test-origin candidate-flare-control
      - name: Snapshot append-only sentinel evidence before controls
        run: |
          baseline="$(docker compose exec -T candidate-private-sentinel python /probe/sentinel_ledger.py snapshot)"
          printf 'SENTINEL_LEDGER_BASELINE=%s\n' "$baseline" >> "$GITHUB_ENV"
      - name: Verify private sentinel response positive control
        run: |
          nonce="$(docker compose exec -T candidate-private-sentinel python -c 'import os, uuid; from urllib.request import urlopen; nonce=uuid.uuid4().hex; host=os.environ["SENTINEL_BIND_HOST"]; r=urlopen(f"http://{host}:19001/positive-control/{nonce}", timeout=2); body=r.read(128); assert r.status == 200 and r.headers.get("Content-Type") == "text/plain" and r.headers.get("Access-Control-Allow-Origin") == "*" and body == f"PRIVATE_SENTINEL_RESPONSE_V1:{nonce}".encode(); print(nonce)')"
          [[ "$nonce" =~ ^[0-9a-f]{32}$ ]]
          printf 'PRIVATE_SENTINEL_POSITIVE_NONCE=%s\n' "$nonce" >> "$GITHUB_ENV"
      - name: Verify host bridge sentinel positive viability before denial probes
        run: |
          nonce="$(docker compose exec -T candidate-capture-egress python /probe/host_bridge_sentinel.py)"
          [[ "$nonce" =~ ^[0-9a-f]{32}$ ]]
          printf 'HOST_BRIDGE_POSITIVE_NONCE=%s\n' "$nonce" >> "$GITHUB_ENV"
      - name: Verify the fixed agent-to-scraper HTTP ingress bridge
        run: >-
          docker compose exec -T candidate-private-sentinel
          python /probe/scraper_ingress_boundary_probe.py
      - name: Verify unrelated egress services cannot reach the model gateway
        run: >-
          docker compose exec -T candidate-capture-egress python -c
          "import socket; s=socket.socket(); s.settimeout(1); r=s.connect_ex(('172.31.254.34',8080)); s.close(); assert r != 0, 'unexpected model gateway reachability'"
      - name: Verify direct scraper network denial and fixed model/source brokers
        run: >-
          docker compose exec -T --user 10001:20000 candidate-scraper python -
          < tests/integration/scraper_egress_boundary_probe.py
      - name: Verify the Flare control API through its permissioned socket
        run: >-
          docker compose exec -T --user 10001:20000 candidate-scraper python -
          < tests/integration/protected_flare_api_probe.py
      - name: Verify hostile JavaScript did not reach the private sentinel
        if: always()
        run: |
          docker compose exec -T candidate-private-sentinel python /probe/sentinel_ledger.py verify "$SENTINEL_LEDGER_BASELINE" "$PRIVATE_SENTINEL_POSITIVE_NONCE" "$HOST_BRIDGE_POSITIVE_NONCE"
      - name: Collect bounded composition diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 candidate-capture-egress candidate-model-egress \
            candidate-scraper candidate-scraper-ingress candidate-scraper-state-control \
            candidate-scraper-model-control candidate-browser-renderer \
            candidate-browser-controller candidate-flare-renderer candidate-flare-control \
            candidate-scraper-socket-init candidate-flare-control-socket-init \
            candidate-private-sentinel candidate-llm
          scraper_id=$(docker compose ps -q candidate-scraper)
          if [ -n "$scraper_id" ]; then
            docker inspect --format '{{.Name}} health={{json .State.Health}}' "$scraper_id"
          fi
      - name: Tear down protected capture composition
        if: always()
        run: |
          docker compose down --volumes --remove-orphans --timeout 15

  research-storage:
    name: PostgreSQL Storage Probes
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.requires_full_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: compose.research-storage.yml
      COMPOSE_PROFILES: storage
      COMPOSE_PROJECT_NAME: research-ci-${{ github.run_id }}-${{ github.run_attempt }}
      RESEARCH_POSTGRES_PASSWORD_FILE: /tmp/research-postgres-password-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure hosted-runner Docker Hub cache
        run: python3 scripts/configure_ci_dockerhub_mirror.py
      - name: Validate isolated replacement candidate definition
        run: |
          umask 077
          printf 'ci-only-password\n' > /tmp/candidate-postgres-password
          CANDIDATE_POSTGRES_PASSWORD_FILE=/tmp/candidate-postgres-password \
          CANDIDATE_API_KEY=ci-only-api-key \
          LLM_BASE_URL=http://llm.invalid/v1 \
          LLM_API_KEY=ci-only-llm-key \
            docker compose -f compose.experimental-candidate.yml config --quiet
      - name: Create ephemeral database credential
        run: |
          umask 077
          openssl rand -hex 32 > "$RESEARCH_POSTGRES_PASSWORD_FILE"
          echo "RESEARCH_PROBE_UID=$(id -u)" >> "$GITHUB_ENV"
      - name: Resolve and start isolated database
        run: |
          python3 scripts/ci_public_image_prefetch.py --group storage --profile storage --receipt storage-public-image-prefetch.json
          docker compose config --quiet
          docker compose config --services
          docker compose up -d --wait --pull never research-postgres
      - name: Upload storage public-image prefetch receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-public-image-prefetch
          path: storage-public-image-prefetch.json
          if-no-files-found: warn
      - name: Probe commits and independent connections
        run: |
          docker compose run --rm storage-probe write
          docker compose run --rm storage-probe read
      - name: Recreate database container and verify retained bytes
        run: |
          docker compose up -d --force-recreate --wait --pull never research-postgres
          docker compose run --rm storage-probe read
          docker compose images
          docker compose run --rm storage-probe cleanup
      - name: Exercise retained-source application adapter
        run: docker compose run --build --rm storage-adapter
      - name: Exercise durable human-guidance ownership
        run: |
          docker compose up -d --wait --pull never research-valkey
          docker compose run --rm -T storage-adapter guidance-owner > guidance-owner-result.json
          cat guidance-owner-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durable guidance ownership evidence
        uses: actions/upload-artifact@v7
        with:
          name: durable-guidance-owner-result
          path: guidance-owner-result.json
          if-no-files-found: error
      - name: Exercise pgvector shadow adapter in the retained store
        run: docker compose run --rm storage-adapter shadow
      - name: Back up schema one and exercise retained revisions
        run: |
          set -eu
          umask 077
          migration_dir=$(mktemp -d)
          docker compose run --rm -T storage-adapter source-state > "$migration_dir/before.json"
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-one.sql"
          docker compose run --rm -T storage-adapter revision
          docker compose exec -T research-postgres createdb -U research_owner research_pre_revision_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_revision_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-one.sql"
          docker compose run --rm -T -e PGDATABASE=research_pre_revision_restore storage-adapter source-state > "$migration_dir/restored.json"
          diff -u "$migration_dir/before.json" "$migration_dir/restored.json"
      - name: Back up schema two and exercise retained publications
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/publication-migration.XXXXXX")
          chmod 700 "$migration_dir"
          docker compose run --rm -T storage-adapter source-state > "$migration_dir/sources-before.json"
          docker compose run --rm -T storage-adapter revision-state > "$migration_dir/revisions-before.json"
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-two.sql"
          docker compose run --rm -T storage-adapter publication
          docker compose exec -T research-postgres createdb -U research_owner research_pre_publication_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_publication_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-two.sql"
          docker compose run --rm -T -e PGDATABASE=research_pre_publication_restore storage-adapter source-state > "$migration_dir/sources-restored.json"
          docker compose run --rm -T -e PGDATABASE=research_pre_publication_restore storage-adapter revision-state > "$migration_dir/revisions-restored.json"
          cmp "$migration_dir/sources-before.json" "$migration_dir/sources-restored.json"
          cmp "$migration_dir/revisions-before.json" "$migration_dir/revisions-restored.json"
      - name: Back up schema three and exercise historical rerenders
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/rerender-migration.XXXXXX")
          for kind in source revision publication; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-three.sql"
          docker compose run --rm -T storage-adapter rerender
          docker compose exec -T research-postgres createdb -U research_owner research_pre_rerender_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_rerender_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-three.sql"
          for kind in source revision publication; do
            docker compose run --rm -T -e PGDATABASE=research_pre_rerender_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done
      - name: Exercise bounded artifact export and offline validation
        run: docker compose run --rm -T storage-adapter export
      - name: Back up schema four and exercise scoped imports
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/import-migration.XXXXXX")
          for kind in source revision publication; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-four.sql"
          docker compose run --rm -T storage-adapter import
          docker compose exec -T research-postgres createdb -U research_owner research_pre_import_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_import_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-four.sql"
          for kind in source revision publication; do
            docker compose run --rm -T -e PGDATABASE=research_pre_import_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done
      - name: Back up schema five and exercise expiry collection
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/expiry-migration.XXXXXX")
          for kind in source revision publication import; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-five.sql"
          docker compose run --rm -T storage-adapter expiry
          docker compose exec -T research-postgres createdb -U research_owner research_pre_expiry_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_expiry_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-five.sql"
          for kind in source revision publication import; do
            docker compose run --rm -T -e PGDATABASE=research_pre_expiry_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done
      - name: Back up schema six and exercise complete research histories
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/research-migration.XXXXXX")
          for kind in source revision publication import; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-six.sql"
          docker compose run --rm -T storage-adapter research
          docker compose exec -T research-postgres createdb -U research_owner research_pre_complete_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_complete_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-six.sql"
          for kind in source revision publication import; do
            docker compose run --rm -T -e PGDATABASE=research_pre_complete_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done
      - name: Back up schema seven and exercise complete research publications
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/complete-publication-migration.XXXXXX")
          for kind in source revision publication import research; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-seven.sql"
          docker compose run --rm -T storage-adapter research-publication
          docker compose exec -T research-postgres createdb -U research_owner research_pre_complete_publication_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_complete_publication_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-seven.sql"
          for kind in source revision publication import research; do
            docker compose run --rm -T -e PGDATABASE=research_pre_complete_publication_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done

      - name: Exercise complete research export snapshots
        run: docker compose run --rm -T storage-adapter research-export

      - name: Back up schema eight and exercise complete research imports
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/complete-import-migration.XXXXXX")
          for kind in source revision publication import research research-publication; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-eight.sql"
          docker compose run --rm -T storage-adapter research-import
          docker compose exec -T research-postgres createdb -U research_owner research_pre_complete_import_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_complete_import_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-eight.sql"
          for kind in source revision publication import research research-publication; do
            docker compose run --rm -T -e PGDATABASE=research_pre_complete_import_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done

      - name: Back up schema nine and exercise consolidated journey storage
        run: |
          set -euo pipefail
          umask 077
          migration_dir=$(mktemp -d "$RUNNER_TEMP/consolidated-migration.XXXXXX")
          for kind in source revision publication import research research-publication; do
            docker compose run --rm -T storage-adapter "$kind-state" > "$migration_dir/$kind-before.json"
          done
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$migration_dir/schema-nine.sql"
          docker compose run --rm -T storage-adapter consolidated
          docker compose exec -T research-postgres createdb -U research_owner research_pre_consolidated_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_pre_consolidated_restore --set=ON_ERROR_STOP=1 --single-transaction < "$migration_dir/schema-nine.sql"
          for kind in source revision publication import research research-publication; do
            docker compose run --rm -T -e PGDATABASE=research_pre_consolidated_restore storage-adapter "$kind-state" > "$migration_dir/$kind-restored.json"
            cmp "$migration_dir/$kind-before.json" "$migration_dir/$kind-restored.json"
          done

      - name: Verify bounded storage connection admission
        run: docker compose run --rm -T storage-adapter admission

      - name: Rehearse backup restore and post-backup deletion
        run: |
          set -eu
          umask 077
          restore_dir=$(mktemp -d)
          docker compose run --rm -T storage-adapter restore-seed
          started=$SECONDS
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$restore_dir/backup.sql"
          dump_seconds=$((SECONDS - started))
          docker compose run --rm -T storage-adapter restore-delete > "$restore_dir/deletions.json"
          docker compose exec -T research-postgres createdb -U research_owner research_restore_probe
          started=$SECONDS
          docker compose exec -T research-postgres psql -X -U research_owner -d research_restore_probe --set=ON_ERROR_STOP=1 --single-transaction < "$restore_dir/backup.sql"
          restore_seconds=$((SECONDS - started))
          # A successful SQL restore remains quarantined without current deletions.
          if docker compose run --rm -T -e PGDATABASE=research_restore_probe storage-adapter restore-verify < /dev/null; then
            echo 'Restore incorrectly accepted missing deletion history' >&2
            exit 1
          fi
          printf '%s' '{"schema_version":"fixture-deletion-inventory/1","deleted":[]}' > "$restore_dir/incomplete.json"
          if docker compose run --rm -T -e PGDATABASE=research_restore_probe storage-adapter restore-verify < "$restore_dir/incomplete.json"; then
            echo 'Restore incorrectly accepted incomplete deletion history' >&2
            exit 1
          fi
          docker compose run --rm -T -e PGDATABASE=research_restore_probe storage-adapter restore-verify < "$restore_dir/deletions.json" > restore-result.json
          echo "Dump seconds: $dump_seconds; restore seconds: $restore_seconds; backup bytes: $(wc -c < "$restore_dir/backup.sql")" >> "$GITHUB_STEP_SUMMARY"
          cat restore-result.json >> "$GITHUB_STEP_SUMMARY"
          # A corrupt dump must fail before the database is considered usable.
          cp "$restore_dir/backup.sql" "$restore_dir/corrupt.sql"
          printf '\nTHIS IS NOT VALID SQL;\n' >> "$restore_dir/corrupt.sql"
          docker compose exec -T research-postgres createdb -U research_owner research_corrupt_restore
          if docker compose exec -T research-postgres psql -X -U research_owner -d research_corrupt_restore --set=ON_ERROR_STOP=1 --single-transaction < "$restore_dir/corrupt.sql"; then
            echo 'Corrupt restore unexpectedly succeeded' >&2
            exit 1
          fi
          docker compose exec -T research-postgres dropdb -U research_owner research_corrupt_restore
          # A process interruption is represented by a deliberately truncated
          # restore. It may exit cleanly after valid statements, but it must not
          # pass the same authoritative deletion/retention verification.
          docker compose exec -T research-postgres createdb -U research_owner research_interrupted_restore
          set +e
          head -n 32 "$restore_dir/backup.sql" | docker compose exec -T research-postgres psql -X -U research_owner -d research_interrupted_restore --set=ON_ERROR_STOP=1 --single-transaction
          interrupted_status=$?
          set -e
          if docker compose run --rm -T -e PGDATABASE=research_interrupted_restore storage-adapter restore-verify < "$restore_dir/deletions.json"; then
            echo 'Interrupted restore unexpectedly passed authoritative verification' >&2
            exit 1
          fi
          docker compose exec -T research-postgres dropdb -U research_owner research_interrupted_restore
          cat > restore-failure-controls.json <<EOF
          {"schema_version":"fixture-restore-failure-controls/1","corrupt_restore_rejected":true,"interrupted_restore_rejected":true,"interrupted_psql_status":$interrupted_status}
          EOF
      - name: Upload bounded restore result
        uses: actions/upload-artifact@v7
        with:
          name: source-storage-restore-result
          path: restore-result.json
          if-no-files-found: error
      - name: Upload restore failure controls
        uses: actions/upload-artifact@v7
        with:
          name: source-storage-restore-failure-controls
          path: restore-failure-controls.json
          if-no-files-found: error
      - name: Rehearse consolidated restore and post-backup deletion
        run: |
          set -euo pipefail
          umask 077
          restore_dir=$(mktemp -d "$RUNNER_TEMP/consolidated-restore.XXXXXX")
          docker compose run --rm -T storage-adapter consolidated-restore-seed > "$restore_dir/seed.json"
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$restore_dir/backup.sql"
          docker compose run --rm -T storage-adapter consolidated-restore-delete < "$restore_dir/seed.json" > "$restore_dir/current.json"
          docker compose exec -T research-postgres createdb -U research_owner research_consolidated_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_consolidated_restore --set=ON_ERROR_STOP=1 --single-transaction < "$restore_dir/backup.sql"
          if docker compose run --rm -T -e PGDATABASE=research_consolidated_restore storage-adapter consolidated-restore-verify < /dev/null; then
            echo 'Consolidated restore accepted missing deletion history' >&2
            exit 1
          fi
          if docker compose run --rm -T -e PGDATABASE=research_consolidated_restore storage-adapter consolidated-restore-verify < "$restore_dir/seed.json"; then
            echo 'Consolidated restore accepted stale deletion history' >&2
            exit 1
          fi
          docker compose run --rm -T -e PGDATABASE=research_consolidated_restore storage-adapter consolidated-restore-verify < "$restore_dir/current.json" > consolidated-restore-result.json
          cat consolidated-restore-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload consolidated restore result
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-storage-restore-result
          path: consolidated-restore-result.json
          if-no-files-found: error
      - name: Measure declared retained-storage capacity
        timeout-minutes: 22
        run: python3 tests/storage/run_capacity_probe.py
      - name: Upload capacity evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-storage-capacity-result
          path: capacity-results/
          if-no-files-found: warn
      - name: Exercise atomic PostgreSQL artifact authority
        run: docker compose run --rm -T storage-adapter artifact-authority
      - name: Rehearse combined PostgreSQL and Valkey authority restore
        run: |
          set -eu
          restore_dir=$(mktemp -d "$RUNNER_TEMP/combined-authority.XXXXXX")
          docker compose up -d --wait research-valkey
          docker compose run --rm -T storage-adapter combined-authority-seed > "$restore_dir/seed.json"
          docker compose exec -T research-postgres pg_dump -U research_owner -d research_experiment --no-owner --no-privileges > "$restore_dir/backup.sql"
          docker compose exec -T research-postgres createdb -U research_owner research_combined_authority_restore
          docker compose exec -T research-postgres psql -X -U research_owner -d research_combined_authority_restore --set=ON_ERROR_STOP=1 --single-transaction < "$restore_dir/backup.sql"
          docker compose run --rm -T \
            -e PGDATABASE=research_combined_authority_restore \
            -e RESTORE_VALKEY_URL=redis://research-valkey:6379/14 \
            storage-adapter combined-authority-verify \
            < "$restore_dir/seed.json" > combined-authority-restore-result.json
          cat combined-authority-restore-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined authority restore result
        uses: actions/upload-artifact@v7
        with:
          name: combined-authority-restore-result
          path: combined-authority-restore-result.json
          if-no-files-found: error
      - name: Stop isolated project while preserving volume
        if: always()
        run: docker compose down --timeout 30

  runtime-gate:
    name: Research Runtime Gate
    needs:
      - changes
      - twin-contracts
      - integration-tests
      - research-storage
      - protected-browser-profile
      - protected-flare-profile
      - protected-capture-composition
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected validation
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.requires_full_runtime }}
          TWIN_REQUIRED: ${{ needs.changes.outputs.requires_twin_contracts }}
          RUNTIME_RESULT: ${{ needs.integration-tests.result }}
          BROWSER_PROFILE_RESULT: ${{ needs.protected-browser-profile.result }}
          PROTECTED_FLARE_RESULT: ${{ needs.protected-flare-profile.result }}
          PROTECTED_CAPTURE_RESULT: ${{ needs.protected-capture-composition.result }}
          TWIN_RESULT: ${{ needs.twin-contracts.result }}
          STORAGE_RESULT: ${{ needs.research-storage.result }}
        run: |
          set -eu
          test "$CLASSIFICATION" = success
          for required in "$RUNTIME_REQUIRED" "$TWIN_REQUIRED"; do
            case "$required" in true|false) ;; *) exit 1 ;; esac
          done
          if [ "$RUNTIME_REQUIRED" = true ]; then
            test "$RUNTIME_RESULT" = success
            test "$STORAGE_RESULT" = success
            test "$BROWSER_PROFILE_RESULT" = success
            test "$PROTECTED_FLARE_RESULT" = success
            test "$PROTECTED_CAPTURE_RESULT" = success
          else
            echo "Runtime integration not required for this documentation-only change."
          fi
          if [ "$TWIN_REQUIRED" = true ]; then
            test "$TWIN_RESULT" = success
          fi

# Grounded Answer & Research Evaluation (issue #570)
#
# Advisory nightly/manual run of the broad answer/research eval suite on the
# self-hosted fixture stack. Not a PR trigger and not a required PR check: a
# failure here never blocks ordinary fork or PR CI. Results are advisory, and the
# provenance artifact is uploaded for review.
#
# The broad suite is hermetic and deterministic: it drives the real
# answer/research pipeline in-process against the search/LLM twins (no live
# providers). The fixture stack is started only to exercise one real-route HTTP
# /v2/answer smoke over agent-svc-fixture.

name: Grounded Answer Eval (Nightly/Manual)

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answer-evals:
    if: github.repository == 'groktopus/groktocrawl' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, groktopus, docker]
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: groktocrawl-answer-evals-${{ github.ref }}
      cancel-in-progress: false
    # No default-project cleanup: this daemon also hosts unrelated workloads.
    env:
      COMPOSE_PROJECT_NAME: groktocrawl-answer-evals-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:compose.answer-evals.yml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install locked fast-test environment
        run: uv sync --locked --no-dev --group fast-tests

      - name: Set up .env
        run: |
          cp .env.sample .env
          echo "TWIN_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> .env
          echo "LLM_BASE_URL=http://llm-svc:8011/v1?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> .env
          echo "LLM_MODEL=fixture-model" >> .env
          echo "SCRAPER_PRIVATE_URL_ALLOWLIST=test-site,tier3-fixture" >> .env
          echo "AGENT_SEARCH_RATE_LIMIT=1000/1s" >> .env

      - name: Build and start fixture stack
        run: |
          docker compose build --no-cache llm-svc
          docker compose build test-site slopsearx-fixture agent-svc-fixture
          docker compose up -d --build valkey scraper-svc
          docker compose --profile fixture up -d --force-recreate llm-svc test-site slopsearx-fixture agent-svc-fixture
        timeout-minutes: 15

      - name: Discover fixture endpoints
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit

          endpoints = (
              ("AGENT_FIXTURE_BASE_URL", "agent-svc-fixture", "8080"),
              ("LLM_FIXTURE_BASE_URL", "llm-svc", "8011"),
              ("SEARCH_FIXTURE_BASE_URL", "slopsearx-fixture", "8080"),
          )
          exports = []
          for name, service, port in endpoints:
              address = subprocess.check_output(
                  ["docker", "compose", "port", service, port], text=True
              ).strip()
              url = "http://" + address
              parsed = urlsplit(url)
              if parsed.hostname != "127.0.0.1" or not parsed.port:
                  raise SystemExit(f"invalid loopback endpoint for {service}")
              exports.append(f"{name}={url}")
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write("\n".join(exports) + "\n")
          PY

      - name: Wait for fixture stack
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          endpoints = (
              os.environ["AGENT_FIXTURE_BASE_URL"],
              os.environ["LLM_FIXTURE_BASE_URL"],
              os.environ["SEARCH_FIXTURE_BASE_URL"],
          )
          for endpoint in endpoints:
              url = endpoint + "/health"
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      time.sleep(3)
              else:
                  raise SystemExit(f"timed out waiting for {url}")
          PY

      - name: Run broad answer/research eval (in-process) + HTTP smoke
        env:
          PYTHONPATH: agent-svc:scraper-svc:llm-svc:slopsearx-fixture:parse-svc:portal-svc:browser-svc:semantic-svc:.
        run: |
          set +e
          uv run --no-sync python3 scripts/run_answer_evals.py --selection broad \
            --output-dir eval-out/broad \
            --http-smoke "${AGENT_FIXTURE_BASE_URL}"
          status=$?
          # Advisory: the scheduled/manual run reports, it does not gate PRs.
          exit "$status"

      - name: Upload eval provenance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: answer-evals-broad-${{ github.run_id }}
          path: eval-out/
          if-no-files-found: warn

      - name: Tear down eval fixture stack
        if: always()
        # Include every started profile. Remove only this run's disposable data
        # and auto-named build images, never the shared default project.
        run: docker compose --profile fixture down --volumes --remove-orphans --rmi local --timeout 30

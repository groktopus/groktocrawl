# Unit and service test lane.
name: Fast Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    env:
      DURABLE_RESEARCH_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install declared test dependencies
        run: uv sync --locked --no-dev --group fast-tests
      - name: Verify coverage tooling
        run: uv run --no-sync python -c "import coverage, pytest_cov; print(f'coverage={coverage.__version__} pytest-cov={pytest_cov.__version__}')"
      - name: Run unit and service tests
        env:
          QA_OUTCOME_PATH: ${{ github.workspace }}/qa-outcomes-fast.json
        run: >-
          mkdir -p coverage &&
          PYTHONPATH=agent-svc:scraper-svc:llm-svc:slopsearx-fixture:parse-svc:portal-svc:browser-svc:semantic-svc:.
          uv run --no-sync pytest tests/unit/ tests/service/
          --cov-report=xml:coverage/fast.xml
          --cov-report=json:coverage/fast.json
          --cov-report=term-missing

      - name: Exercise optional future LangGraph runtime
        run: >-
          PYTHONPATH=agent-svc
          uv run --no-project --with langgraph==0.6.11 --with pytest
          --with langgraph-checkpoint-sqlite --with redis --with pytest-asyncio
          --with pydantic pytest -q -o addopts=''
          tests/unit/test_adaptive_runtime.py tests/unit/test_specialist_runtime.py
          tests/unit/test_guidance_runtime.py tests/unit/test_fork_runtime.py
          tests/unit/test_capability_runtime.py

      - name: Smoke future-runtime measurements
        run: >-
          PYTHONPATH=agent-svc
          uv run --no-project --with langgraph==0.6.11 --with pydantic
          python scripts/measure_future_runtime.py --repetitions 1
          --output /tmp/future-runtime-measurements

      - name: Smoke durable-guidance measurements
        run: >-
          PYTHONPATH=agent-svc
          uv run --no-project --with langgraph==0.6.11
          --with langgraph-checkpoint-sqlite --with redis --with pydantic
          python scripts/measure_guidance_runtime.py --repetitions 1
          --output /tmp/guidance-runtime-measurements

      - name: Smoke checkpoint-fork measurements
        run: >-
          PYTHONPATH=agent-svc
          uv run --no-project --with langgraph==0.6.11
          --with langgraph-checkpoint-sqlite --with pydantic
          python scripts/measure_fork_runtime.py --repetitions 1
          --output /tmp/fork-runtime-measurements

      - name: Smoke capability-substitution measurements
        run: >-
          PYTHONPATH=agent-svc uv run --no-project --with langgraph==0.6.11
          --with langgraph-checkpoint-sqlite --with pydantic
          python scripts/measure_capability_runtime.py --repetitions 1
          --output /tmp/capability-runtime-measurements

      - name: Run mcp-svc unit tests
        run: >-
          cd mcp-svc &&
          uv run --with pytest --with pytest-asyncio --with pytest-cov
          python -m pytest tests/test_mcp_server.py tests/test_client.py tests/test_session_store.py tests/test_evidence.py tests/test_followup.py
          -q -p no:cacheprovider -o "addopts=" -o "testpaths=tests"

      - name: Check changed-line coverage
        id: coverage_gate
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$COVERAGE_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Changed-line coverage skipped: no prior commit exists for this ref."
            exit 0
          fi
          uv run --no-sync python scripts/coverage_gate.py \
            --coverage-json coverage/fast.json \
            --base-sha "$COVERAGE_BASE_SHA" \
            --head-sha "$COVERAGE_HEAD_SHA" \
            --summary-path coverage/fast-risk-summary.md

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/fast-risk-summary.md ]; then
            cat coverage/fast-risk-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" = "success" ] && [ -f coverage/fast.json ]; then
            echo "Changed-line coverage comparison skipped: no prior commit exists for this ref." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" = "skipped" ]; then
            echo "Changed-line coverage comparison did not run because an earlier test step failed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.coverage_gate.outcome }}" != "success" ]; then
            echo "Changed-line coverage gate failed before writing its summary." >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f coverage/fast.json ]; then
            echo "Changed-line coverage report unavailable; coverage JSON is missing from the workspace." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test outcome summary
        if: always()
        run: |
          if [ -f qa-outcomes-fast.md ]; then
            cat qa-outcomes-fast.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "QA outcome report unavailable; pytest did not reach session finish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test outcome reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-outcomes
          path: qa-outcomes-fast.*
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-coverage
          path: coverage/*
          if-no-files-found: warn

name: Vector Store Restart Evaluation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional stable identifier for the isolated restart run
        required: false
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Verify vector data across provider restart
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: groktocrawl-x-vector-restart-${{ github.run_id }}
      VECTOR_EVAL_POSTGRES_PASSWORD: vector-restart-${{ github.run_id }}-${{ github.run_attempt }}
      VECTOR_EVAL_RUN_ID: ${{ inputs.run_id || format('restart-{0}', github.run_id) }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v5

      - name: Validate isolated Compose file
        run: docker compose -f compose.vector-evaluation.yml --profile vector-eval config --quiet

      - name: Start isolated vector services
        run: docker compose -f compose.vector-evaluation.yml --profile vector-eval up -d --wait

      - name: Create private evaluation runner
        run: |
          mkdir -p vector-restart-out
          qdrant_container=$(docker compose -f compose.vector-evaluation.yml --profile vector-eval ps -q vector-eval-qdrant)
          eval_network=$(docker inspect "$qdrant_container" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          echo "::add-mask::$VECTOR_EVAL_POSTGRES_PASSWORD"
          runner=$(docker run -d --network bridge \
            -e VECTOR_EVAL_POSTGRES_PASSWORD \
            -e VECTOR_EVAL_RUN_ID \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/vector-restart-out:/out" \
            -w /workspace python:3.12-slim sleep 900)
          echo "$runner" > runner-id
          docker network connect "$eval_network" "$runner"
          echo "RUNNER_ID=$runner" >> "$GITHUB_ENV"

      - name: Seed isolated providers
        run: |
          docker exec "$RUNNER_ID" sh -ceu '
            python -m pip install --disable-pip-version-check --no-cache-dir \
              "psycopg[binary]==3.3.5" "qdrant-client>=1.13.0,<1.20.0"
            python scripts/run_vector_store_restart_evaluation.py \
              --phase seed \
              --qdrant-url http://vector-eval-qdrant:6333 \
              --postgres-dsn "postgresql://vector_eval:${VECTOR_EVAL_POSTGRES_PASSWORD}@vector-eval-postgres:5432/vector_eval" \
              --run-id "$VECTOR_EVAL_RUN_ID" \
              --allow-isolated-database \
              --output /out/seed.json
          '

      - name: Restart isolated providers
        run: |
          docker compose -f compose.vector-evaluation.yml --profile vector-eval restart vector-eval-qdrant vector-eval-postgres
          docker compose -f compose.vector-evaluation.yml --profile vector-eval up -d --wait

      - name: Verify data after provider restart
        run: |
          docker exec "$RUNNER_ID" sh -ceu '
            python scripts/run_vector_store_restart_evaluation.py \
              --phase verify \
              --qdrant-url http://vector-eval-qdrant:6333 \
              --postgres-dsn "postgresql://vector_eval:${VECTOR_EVAL_POSTGRES_PASSWORD}@vector-eval-postgres:5432/vector_eval" \
              --run-id "$VECTOR_EVAL_RUN_ID" \
              --allow-isolated-database \
              --cleanup \
              --output /out/verify.json
          '

      - name: Enforce restart gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          seed = json.loads(Path("vector-restart-out/seed.json").read_text())
          verify = json.loads(Path("vector-restart-out/verify.json").read_text())
          assert seed["phase"] == "seed"
          assert verify["phase"] == "verify"
          assert verify["expected_restart"] is True
          for packet in (seed, verify):
              for candidate in packet["candidates"]:
                  assert candidate["ok"], candidate
                  assert all(candidate["gates"].values()), candidate
          print("restart gates passed for", [c["name"] for c in verify["candidates"]])
          PY

      - name: Upload restart evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vector-store-restart-evaluation-${{ github.run_id }}
          path: vector-restart-out/
          if-no-files-found: warn

      - name: Stop isolated vector services
        if: always()
        run: |
          docker rm -f "$RUNNER_ID" >/dev/null 2>&1 || true
          docker compose -f compose.vector-evaluation.yml --profile vector-eval down --volumes --remove-orphans --timeout 30

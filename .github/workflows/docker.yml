# Docker Build & Publish CI
#
# Builds and publishes Docker images for GroktoCrawl services to ghcr.io.
# Uses a build matrix with capped parallelism to avoid runner resource exhaustion.
#
# Tags:
#   - main branch → latest, unstable
#   - vX.Y.Z tag  → stable, X, X.Y, X.Y.Z
#   - PR to main  → runtime integration only when changed paths require it

name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: groktopus

jobs:
  changes:
    name: Classify runtime changes
    runs-on: ubuntu-latest
    outputs:
      requires_full_runtime: ${{ steps.classify.outputs.requires_full_runtime }}
      affected_services: ${{ steps.classify.outputs.affected_services }}
      requires_twin_contracts: ${{ steps.classify.outputs.requires_twin_contracts }}
      twin_test_selection: ${{ steps.classify.outputs.twin_test_selection }}
      changed_paths_json: ${{ steps.classify.outputs.changed_paths_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fork-PR workflow-edit guard (#562). A pull request from a fork that
      # modifies .github/workflows/** runs from the PR MERGE REF, i.e. with
      # this very file already rewritten by the fork — so no in-repo check can
      # be trusted there. This step is DEFENSE IN DEPTH ONLY (ADR-0056): it
      # fails fast so the required checks go red as a paper trail. The
      # authoritative, non-bypassable control is PLATFORM-LEVEL and lives in
      # the org settings (runner group [self-hosted, groktopus, docker] with
      # allows_public_repositories=false; optional restricted_to_workflows +
      # allowlist; "Require approval for all external contributors"). Those
      # org-level controls are currently DEFERRED by maintainer decision with
      # the residual risk accepted — exact remediation steps:
      # docs/runbooks/self-hosted-runner-fork-protection.md
      #
      # The step lives inside this `changes` classification job whose `if`
      # cannot skip classification, and its own always() guard means an
      # earlier step failure cannot prevent its evaluation. A failing step
      # fails the whole `changes` job, which trips runtime-gate's fail-closed
      # branch ("Fail when change classification fails") — exactly the
      # intended red paper trail. Null-guard note (corrected 2026-08-24,
      # scrutiny round 1 on #562): GitHub expressions use LOOSE equality with
      # numeric coercion (official expressions reference; actions/runner
      # EvaluationResult.cs) — Null->0 and Boolean false->0, so `fork == null`
      # and `fork == false` are BOTH true, and the once-shipped `fork != false`
      # evaluated FALSE for a null fork (deleted forks), silently SKIPPING this
      # detector. The condition is therefore an explicit disjunction that arms
      # for every pull_request event; under the same coercion a proven
      # same-repository PR (`fork == false`) also matches, and the seam then
      # trusts only the rendered literal "false" in CI_PR_FORK (null renders as
      # an empty string), keeping deleted forks fail-closed.
      - name: Detect fork PR modifying GitHub workflows
        id: fork_guard
        if: >-
          always() && github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.fork == true ||
          github.event.pull_request.head.repo.fork == null)
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base=$(git merge-base "$CI_BASE_SHA" "$CI_HEAD_SHA")
          git diff --name-only "$merge_base" "$CI_HEAD_SHA" | python3 scripts/ci_fork_pr_guard.py

      - name: Test change classifier
        run: python3 tests/service/test_ci_change_classification.py

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            merge_base=$(git merge-base "$base" "$head")
            changed_paths=$(git diff --name-only "$merge_base" "$head")
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed_paths=$(git diff-tree --root --no-commit-id --name-only -r "$head")
            else
              changed_paths=$(git diff --name-only "$base" "$head")
            fi
          fi

          changed_paths_json=$(printf '%s\n' "$changed_paths" | python3 -c 'import json, sys; print(json.dumps([line for line in sys.stdin.read().splitlines() if line]))')
          echo "changed_paths_json=$changed_paths_json" >> "$GITHUB_OUTPUT"

          requires_full_runtime=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py)
          echo "requires_full_runtime=$requires_full_runtime" >> "$GITHUB_OUTPUT"
          affected_services=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py --affected-services)
          echo "affected_services=$affected_services" >> "$GITHUB_OUTPUT"
          requires_twin_contracts=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py --requires-twin-contracts)
          echo "requires_twin_contracts=$requires_twin_contracts" >> "$GITHUB_OUTPUT"
          twin_test_selection=$(printf '%s\n' "$changed_paths" | python3 scripts/classify_ci_changes.py --twin-test-selection)
          echo "twin_test_selection=$twin_test_selection" >> "$GITHUB_OUTPUT"

  twin-contracts:
    name: Twin Contracts
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.requires_twin_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install locked twin dependencies
        run: uv sync --locked --no-dev --group fast-tests
      - name: Run hermetic twin contracts
        id: twin_tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          TWIN_SOCKET_GUARD: "1"
          TWIN_SELECTION: ${{ needs.changes.outputs.twin_test_selection }}
          RUNTIME_SELECTION: ${{ needs.changes.outputs.requires_full_runtime }}
          PYTHONPATH: .:agent-svc:scraper-svc:llm-svc:slopsearx-fixture
          QA_OUTCOME_PATH: twin-out/qa-outcomes.json
        run: |
          mkdir -p twin-out
          # Validate the checked-in scenario/version contract before replay/parity.
          uv run --no-sync python -c "from llm_svc.app import SCHEMA_VERSION as LLM_SCHEMA; from slopsearx_fixture.app import SCHEMA_VERSION as SEARCH_SCHEMA; assert isinstance(LLM_SCHEMA, str) and isinstance(SEARCH_SCHEMA, str) and LLM_SCHEMA and SEARCH_SCHEMA"
          case "$TWIN_SELECTION" in
            search) tests="tests/service/test_slopsearx_fixture.py tests/service/test_searxng_client.py" ;;
            llm) tests="tests/service/test_llm_fixture_contract.py tests/service/test_llm.py" ;;
            all) tests="tests/service/test_llm_fixture_contract.py tests/service/test_slopsearx_fixture.py tests/service/test_research_adapter_parity.py tests/service/test_searxng_client.py" ;;
            none) tests="" ;;
            *) echo "unknown twin selection: $TWIN_SELECTION"; exit 1 ;;
          esac
          if [ -n "$tests" ]; then
             uv run --no-sync python -m pytest $tests -q --no-cov -o addopts= --disable-socket --allow-hosts=127.0.0.1,localhost,::1 --junitxml=twin-out/twin-tests.xml
          fi
           uv run --no-sync python -m pytest tests/service/test_twin_contract.py tests/service/test_twin_network_isolation.py tests/service/test_workflow_contract.py -q --no-cov -o addopts= --disable-socket --allow-hosts=127.0.0.1,localhost,::1 --junitxml=twin-out/twin-contract-tests.xml
      - name: Validate twin provenance
        if: always()
        env:
          TWIN_SELECTION: ${{ needs.changes.outputs.twin_test_selection }}
          RUNTIME_SELECTION: ${{ needs.changes.outputs.requires_full_runtime }}
          TWIN_TEST_OUTCOME: ${{ steps.twin_tests.outcome }}
          TWIN_RESULT: ${{ steps.twin_tests.outcome == 'success' && 'success' || 'failure' }}
          TWIN_FAILURE_SOURCE: ${{ steps.twin_tests.outcome == 'success' && 'none' || 'twin' }}
          TWIN_CHANGED_PATHS_JSON: ${{ needs.changes.outputs.changed_paths_json }}
          TWIN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TWIN_EXECUTION_MODE: hosted
        run: |
          uv run --no-sync python scripts/twin_provenance.py --output twin-out --changed-paths-json "$TWIN_CHANGED_PATHS_JSON"
          uv run --no-sync python -m jsonschema -i twin-out/twin-evidence.json provenance/twin-evidence.schema.json
      - name: Upload twin outcomes and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-twin-contracts
          path: twin-out/
          if-no-files-found: error
      - name: Fail after publishing twin evidence
        if: always() && steps.twin_tests.outcome != 'success'
        run: exit 1

  build-and-push:
    name: ${{ matrix.service }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: agent-svc
            context: .
            dockerfile: agent-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-agent
          - service: scraper-svc
            context: .
            dockerfile: scraper-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-scraper
          - service: browser-svc
            context: .
            dockerfile: browser-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-browser
          - service: semantic-svc
            context: .
            dockerfile: semantic-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-semantic
          - service: portal-svc
            context: .
            dockerfile: portal-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-portal
          - service: parse-svc
            context: .
            dockerfile: parse-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-parse
          - service: mcp-svc
            context: mcp-svc
            dockerfile: mcp-svc/Dockerfile
            image: ghcr.io/groktopus/groktocrawl-mcp
      max-parallel: 2

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=unstable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE_NAME=$(echo "${{ matrix.image }}" | sed 's|.*/||')
          echo "Pruning untagged versions of $PACKAGE_NAME"
          gh api \
            --method GET \
            "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags == null or .metadata.container.tags == []) | .id' \
            | while read version_id; do
              echo "  Deleting version $version_id"
              gh api --method DELETE \
                "/orgs/${{ env.REGISTRY_OWNER }}/packages/container/$PACKAGE_NAME/versions/$version_id" --silent
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: [changes, build-and-push]
    # The fork guard (mirroring droid-review.yml) keeps untrusted fork PR code off the
    # self-hosted runner. This is a best-effort in-workflow control: on `pull_request`
    # events GitHub runs the workflow from the PR merge ref, so a fork that edits this
    # file could bypass the guard. The authoritative, non-bypassable control is
    # platform-level (deny fork PRs to the runner group / require workflow approval for
    # outside collaborators), which is outside this repo and must be configured there.
    # See docs/runbooks/self-hosted-runner-fork-protection.md for the exact org-level
    # remediation steps (currently DEFERRED by maintainer decision; residual risk
    # accepted) and the `Detect fork PR modifying GitHub workflows` step in the
    # `changes` job above for the in-repo detection paper trail (#562).
    #
    # Null-guard note (corrected 2026-08-24, scrutiny round 1 on #562): loose
    # equality coerces Null->0 and Boolean false->0, so a plain
    # `head.repo.fork == false` was TRUE for deleted forks (null) — admitting
    # exactly the PRs this guard exists to stop onto the self-hosted lane.
    # Direct expression arithmetic cannot separate null from false (both are 0),
    # so admission requires the STRING rendering to equal 'false'
    # (format('{0}', ...) yields 'true'/'false'/'' for null; a missing
    # head.repo property also renders ''). Deleted forks are therefore
    # fail-closed OFF the lane.
    if: >-
      always() && ((github.event_name == 'pull_request' && needs.changes.result == 'success' &&
      needs.changes.outputs.requires_full_runtime == 'true' &&
      format('{0}', github.event.pull_request.head.repo.fork) == 'false') ||
      (github.event_name == 'push' && needs.build-and-push.result == 'success'))
    runs-on: [self-hosted, groktopus, docker]
    concurrency:
      group: groktocrawl-integration-${{ github.repository }}
      cancel-in-progress: false
    # Host-port deconfliction for the shared self-hosted Docker daemon: co-tenant
    # compose projects (e.g. grokval copies of this stack) publish the same
    # default ports, so four consecutive runs failed with
    # "Bind for 0.0.0.0:8080 failed: port is already allocated". The 18xxx
    # range is reserved for CI; operator defaults in docker-compose.yml are
    # unchanged, so every other workflow keeps today's behavior.
    #
    # These fixed 18xxx pins are a FALLBACK ONLY: the "Allocate deconflicted host
    # ports" preflight step below bind-probes candidate /100 blocks at run time
    # and exports the winning assignments via $GITHUB_ENV, which overrides these
    # values for every subsequent step (commit 1b26623's static scheme still lost
    # a run when an unknown co-tenant squatted exactly 18081 while its neighbors
    # stayed free — any fixed range loses that race on a shared daemon). They are
    # kept so the job env documents the port map and the stack still starts with
    # sane defaults if the preflight step is ever removed or bypassed.
    env:
      AGENT_PORT: "18080"
      SCRAPER_HOST_PORT: "18001"
      SLOPSEARX_HOST_PORT: "18081"
      PORTAL_HOST_PORT: "18082"
      SEMANTIC_HOST_PORT: "18003"
      LLM_HOST_PORT: "18011"
      TEST_SITE_HOST_PORT: "18005"
      TIER3_HOST_PORT: "18006"
      SLOPSEARX_FIXTURE_HOST_PORT: "18083"
      AGENT_FIXTURE_HOST_PORT: "18084"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install locked fast-test environment
        run: uv sync --locked --no-dev --group fast-tests

      - name: Set up .env
        run: |
          cp .env.sample .env
          echo "TWIN_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> .env
          echo "LLM_BASE_URL=http://llm-svc:8011/v1?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> .env
          echo "LLM_MODEL=fixture-model" >> .env
          echo "CAPTCHA_VISION_BASE_URL=http://llm-svc:8011/v1" >> .env
          echo "CAPTCHA_VISION_API_KEY=fixture-only" >> .env
          echo "CAPTCHA_VISION_MODEL=fixture-model" >> .env
          echo "SCRAPER_PRIVATE_URL_ALLOWLIST=test-site,tier3-fixture" >> .env
          # Gutenberg digital twin (#581): point the gutenberg adapter's
          # EPUB/plain-text downloads and Gutendex enrichment at the
          # deterministic test-site fixture so the integration lane never
          # depends on third-party uptime.
          echo "ADAPTER_GUTENBERG_CACHE_BASE=http://test-site:8000" >> .env
          echo "ADAPTER_GUTENDEX_API_BASE=http://test-site:8000" >> .env
          echo "AGENT_SEARCH_RATE_LIMIT=1000/1s" >> .env
          # mcp-svc DNS-rebinding allowlist: include the compose service name
          # so the integration lane exercises a real non-loopback Host path.
          echo "MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,[::1]:*,mcp-svc:*" >> .env
          # slopsearx-mcp is an opt-in profile-gated companion; it is not run in
          # the integration lane, so no token is needed here.

      - name: Force-remove all stale project containers
        run: docker ps -a --filter name=groktocrawl -q | xargs -r docker rm -f || true

      - name: Clean up stale containers from previous run
        run: docker compose down --remove-orphans --timeout 30 || true

      - name: Ensure HF model cache volume exists
        run: docker volume inspect hf-cache || docker volume create hf-cache

      # Image provisioning is decoupled from stack startup so each service image
      # is built at most once per event (except release tag pushes, which must
      # both publish semver tags and validate the tagged source):
      #   - main push: build-and-push already built and published every image, so
      #     this job pulls the freshly published :latest tags (no rebuild).
      #   - PR: pulls the latest published images for unchanged services (so the
      #     stack matches a known commit), then builds only the images for
      #     services whose paths changed (service-local), gated on the
      #     classifier's affected-services output; unknown/cross-cutting runtime
      #     paths escalate to a full rebuild.
      #   - tag push (v*): build-and-push published only semver tags, so this job
      #     builds the full runtime stack from the tagged source.
      - name: Log in to GitHub Container Registry
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly published service images
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        run: |
          # Best-effort refresh of the published image set. A service may not
          # have a published tag yet (e.g. a newly added service), which fails
          # its manifest lookup; tolerate that and let the build/up steps build
          # the missing image from source instead.
          docker compose --profile indexing pull || true
        timeout-minutes: 10

      - name: Build service images (service-local PR build / tag-push full build)
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          affected="${{ needs.changes.outputs.affected_services }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$affected" ] && [ "$affected" != "all" ]; then
            echo "Service-local PR build for: $affected"
            docker compose --profile indexing build $affected
          else
            echo "Building the full runtime stack."
            docker compose --profile indexing build
          fi
        timeout-minutes: 10

      # Dynamic host-port allocation for the shared self-hosted Docker daemon.
      # A fixed range cannot win the race against unknown co-tenants (1b26623's
      # static 18xxx pins failed when a squatter held exactly 18081 while its
      # neighbors stayed free), so this step bind-probes candidate blocks at run
      # time and exports the winning block via $GITHUB_ENV. GITHUB_ENV values
      # override the job-level env pins above for every subsequent step; compose
      # interpolates ${VAR:-default} from them and all later steps read the same
      # names. Fail-closed: if no free /100 block exists in 18000-19900, fail
      # loudly instead of starting a half-bound stack.
      - name: Allocate deconflicted host ports
        run: |
          python3 - <<'PY'
          import os
          import socket

          OFFSETS = [
              ("AGENT_PORT", 80),
              ("SCRAPER_HOST_PORT", 1),
              ("SEMANTIC_HOST_PORT", 3),
              ("TEST_SITE_HOST_PORT", 5),
              ("TIER3_HOST_PORT", 6),
              ("LLM_HOST_PORT", 11),
              ("SLOPSEARX_HOST_PORT", 81),
              ("PORTAL_HOST_PORT", 82),
              ("SLOPSEARX_FIXTURE_HOST_PORT", 83),
              ("AGENT_FIXTURE_HOST_PORT", 84),
          ]

          def is_free(port: int) -> bool:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  sock.bind(("0.0.0.0", port))
              except OSError:
                  return False
              finally:
                  sock.close()
              return True

          env_file = os.environ["GITHUB_ENV"]
          lines = []
          for base in range(18000, 19901, 100):
              candidates = [(name, base + offset) for name, offset in OFFSETS]
              if not all(is_free(port) for _, port in candidates):
                  continue
              lines = [f"{name}={port}" for name, port in candidates]
              break
          else:
              raise SystemExit(
                  "No free /100 host-port block found in 18000-19900 on the "
                  "shared Docker host; refusing to start a partially bound "
                  "stack. Free or identify the co-tenant holding these ranges."
              )

          with open(env_file, "a") as handle:
              handle.write("\n".join(lines) + "\n")
          for line in lines:
              print(f"exported {line}")
          PY

      - name: Start the Docker stack
        run: docker compose --profile indexing up -d
        timeout-minutes: 10

      - name: Start test fixtures
        run: |
          # Kill any stale llm-svc container, build fresh image, recreate
          docker compose --profile fixture rm -sf llm-svc || true
          docker compose --profile fixture build --no-cache llm-svc
          docker compose --profile fixture build test-site tier3-fixture slopsearx-fixture agent-svc-fixture
          docker compose --profile fixture up -d --force-recreate llm-svc tier3-fixture test-site slopsearx-fixture agent-svc-fixture
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          # Quoted heredoc: bash passes the payload to python verbatim, so the
          # dynamically allocated port is read from the environment instead of
          # interpolated by the shell.
          python3 - <<'PY'
          import os
          import time
          import urllib.request

          url = f"http://localhost:{os.environ['AGENT_PORT']}/health"
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen(url, timeout=5)
                  if r.status == 200:
                      print('Stack healthy')
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Timed out waiting for stack')
          PY

      - name: Wait for semantic-svc
        run: |
          # First check from host that the API is alive. Quoted heredoc: bash
          # passes the payload to python verbatim, so the dynamically allocated
          # port is read from the environment instead of interpolated by the
          # shell.
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          url = f"http://localhost:{os.environ['SEMANTIC_HOST_PORT']}/health"
          deadline = time.time() + 300
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen(url, timeout=5)
                  data = r.read().decode()
                  if r.status == 200 and '"ok"' in data:
                      print('semantic-svc healthy on host')
                      break
              except urllib.error.HTTPError as e:
                  print(f'  waiting ({e.code})...')
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Timed out waiting for semantic-svc on host')
          PY
          # Verify Qdrant is reachable from inside agent-svc (where tests run).
          # Service-DNS URL stays literal: no host-port interpolation needed.
          python3 - <<'PY'
          import subprocess
          import time

          deadline = time.time() + 60
          while time.time() < deadline:
              r = subprocess.run(
                  ['docker', 'compose', 'exec', '-T', 'agent-svc',
                   'python3', '-c',
                   'import urllib.request; u=urllib.request.urlopen("http://semantic-svc:8003/index/stats", timeout=5); print(u.status)'],
                  capture_output=True, text=True, timeout=10
              )
              if r.returncode == 0 and '200' in r.stdout:
                  print('Qdrant ready from agent-svc')
                  break
              print(f'  waiting from agent-svc (rc={r.returncode}): {r.stdout[:80]}')
              time.sleep(5)
          else:
              raise RuntimeError('Timed out waiting for Qdrant from agent-svc')
          PY


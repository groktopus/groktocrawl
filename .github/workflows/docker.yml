      - name: Collect diagnostics on failure
        if: failure()
        run: |
          report="$GITHUB_WORKSPACE/integration-test-diagnostics.txt"
          {
            echo "Integration test failure diagnostics"
            echo "Collected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== docker compose ps -a ==="
            docker compose ps -a || true
            echo
            echo "=== listening TCP sockets ==="
            ss -ltnp || netstat -tlnp || true
            echo
            echo "=== all containers with ports ==="
            docker ps --format '{{.Names}}\t{{.Ports}}' || true
            echo
            echo "=== docker stats --no-stream ==="
            docker stats --no-stream || true
            echo
            echo "=== host memory ==="
            free -h || vm_stat || true
            echo
            echo "=== host filesystem ==="
            df -h || true
            echo
            echo "=== project container state ==="
            docker ps -aq --filter "name=groktocrawl" | while read -r container; do
              docker inspect --format \
                'Name={{.Name}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} FinishedAt={{.State.FinishedAt}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}}' \
                "$container" || true
            done || true
            echo
            echo "=== docker compose logs (last 50 lines) ==="
            docker compose logs --tail 50 || true
          } > "$report" 2>&1 || true

      - name: Upload integration test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-diagnostics
          path: integration-test-diagnostics.txt
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose down --remove-orphans --timeout 30

  runtime-gate:
    name: Runtime Gate
    needs: [changes, twin-contracts, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize docs-only pull request
        if: >-
          github.event_name == 'pull_request' && needs.changes.result == 'success' &&
          needs.changes.outputs.requires_full_runtime == 'false'
        run: echo "Runtime integration was intentionally not needed for this docs-only pull request."

      - name: Summarize fork pull request (integration skipped)
        # String-rendered comparison: covers proven forks ('true') AND
        # deleted forks (head.repo.fork null renders '') — both are untrusted,
        # both get the explicit skipped-for-security summary. Same-repo PRs
        # render 'false' and never match (#562 scrutiny round 1 follow-up).
        if: >-
          github.event_name == 'pull_request' &&
          format('{0}', github.event.pull_request.head.repo.fork) != 'false' &&
          needs.changes.result == 'success'
        run: |-
          echo "Fork pull request: self-hosted integration skipped for security."
          echo "(Includes deleted forks whose head.repo.fork renders null.)"

      - name: Summarize successful runtime validation
        if: >-
          github.event_name == 'pull_request' && needs.changes.result == 'success' &&
          needs.changes.outputs.requires_full_runtime == 'true' &&
          needs.integration-tests.result == 'success'
        run: echo "Runtime integration completed successfully for this pull request."

      - name: Fail when change classification fails
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.result != 'success'
        run: |
          echo "Change classification did not complete; no runtime-validation conclusion was made."
          exit 1

      - name: Fail when required runtime validation fails
        if: >-
          needs.changes.result == 'success' &&
          !(github.event_name == 'pull_request' &&
          needs.changes.outputs.requires_full_runtime == 'false') &&
          !(github.event_name == 'pull_request' &&
          format('{0}', github.event.pull_request.head.repo.fork) != 'false') &&
          needs.integration-tests.result != 'success'
        run: |
          echo "Required runtime integration did not complete successfully."
          exit 1

      - name: Fail when required twin validation fails
        if: >-
          needs.changes.result == 'success' &&
          needs.changes.outputs.requires_twin_contracts == 'true' &&
          needs.twin-contracts.result != 'success'
        run: |
          echo "Required hosted twin contracts did not complete successfully."
          exit 1

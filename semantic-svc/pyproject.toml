[project]
name = "semantic-svc"
version = "0.1.0"
description = "GroktoCrawl semantic search — embedding and reranking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.13.0,<1.20.0",
]

[tool.setuptools]
py-modules = ["app", "auth", "inference", "metrics", "models", "retention", "router_index", "router_migration", "router_search"]

[tool.deptry.per_rule_ignores]
# Uvicorn is the container entry point.
DEP002 = ["uvicorn"]

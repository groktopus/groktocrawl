# Opt-in topology: one API process, 1-4 scraper replicas, one stable gateway.
# Requires Docker Compose >= 2.24.4. See docs/guides/scraper-scaleout.md.
services:
  scraper-svc:
    ports: !reset []
    # ADR-0089: one CPU entitlement and 16 browser lifecycles per replica.
    cpus: 1.0
    environment:
      SCRAPER_MAX_BROWSER_CONCURRENCY: "16"
      SCRAPER_BROWSER_POOL_ENABLED: "true"
      SCRAPER_BROWSER_POOL_MAX_PROCESSES: "2"
      SCRAPER_POLITENESS_ENABLED: "true"
      SCRAPER_DISTRIBUTED_POLITENESS: "true"
    depends_on:
      valkey:
        condition: service_healthy
    stop_grace_period: 75s

  scraper-gateway:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ports:
      - "${SCRAPER_HOST_PORT:-8001}:8001"
    volumes:
      - ./deploy/scraper-gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      scraper-svc:
        condition: service_started
    stop_grace_period: 75s

  agent-svc:
    environment:
      SCRAPER_URL: http://scraper-gateway:8001
      # Weighted browser units: replica count * 16 lifecycles * weight 8.
      # deploy/scaleout.py supplies a value matching --scale.
      ADMISSION_BROWSER_LIMIT: ${ADMISSION_BROWSER_LIMIT:-128}
      ADMISSION_LIGHT_FETCH_LIMIT: "64"
      ADMISSION_LLM_LIMIT: "32"
    depends_on:
      scraper-gateway:
        condition: service_started

  agent-svc-fixture:
    environment:
      SCRAPER_URL: http://scraper-gateway:8001
      ADMISSION_BROWSER_LIMIT: ${ADMISSION_BROWSER_LIMIT:-128}

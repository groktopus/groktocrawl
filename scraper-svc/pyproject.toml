[project]
name = "scraper-svc"
version = "0.7.0"
description = "GroktoCrawl URL-to-markdown scraper service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "curl_cffi>=0.15.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.14.0",
    "beautifulsoup4>=4.13.0",
    "redis>=5.0",
    "youtube_transcript_api>=1.0.0",
    "yt-dlp>=2026.3.13",
    "cloakbrowser==0.5.8",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.51.0",
]

[tool.deptry.per_rule_ignores]
# Uvicorn is the container entry point.
DEP002 = ["uvicorn"]

[project]
name = "browser-svc"
version = "0.3.0"
description = "GroktoCrawl headless browser session service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "playwright>=1.51.0",
    "redis>=5.0.0",
    "httpx>=0.28.1",
]

[tool.deptry.per_rule_ignores]
# Uvicorn is the container entry point.
DEP002 = ["uvicorn"]

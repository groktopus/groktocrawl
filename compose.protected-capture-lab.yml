name: groktocrawl-x-protected-capture-lab

# Qualification-only deterministic peers. This overlay deliberately leaves
# candidate-model-egress and candidate_model_upstream untouched: the live
# LLM route remains the one supplied by the private candidate environment.
services:
  candidate-scraper:
    environment:
      CAPTURE_HOST_BRIDGE_IP: ${CAPTURE_HOST_BRIDGE_IP:-172.31.254.1}
      CAPTURE_HOST_BRIDGE_SUBNET: ${CAPTURE_HOST_BRIDGE_SUBNET:-172.31.254.0/29}
      CAPTURE_HOST_BRIDGE_IP_RANGE: ${CAPTURE_HOST_BRIDGE_IP_RANGE:-172.31.254.4/30}
      CAPTURE_PEER_IP: ${CAPTURE_PEER_IP:-172.31.254.3}
      CAPTURE_EGRESS_IP: ${CAPTURE_EGRESS_IP:-172.31.254.2}
      CAPTURE_FIXTURE_ORIGIN: "http://${CAPTURE_FIXTURE_HOST:-capture-origin.example.test}"
      CAPTURE_PROBE_MODEL_NAME: ${LLM_MODEL:-local}
    volumes:
      - ./tests/integration/host_bridge_sentinel.py:/probe/host_bridge_sentinel.py:ro

  candidate-capture-egress:
    networks:
      candidate_flare_fixture:
        ipv4_address: 93.184.216.38
    extra_hosts:
      - "${CAPTURE_FIXTURE_HOST:-capture-origin.example.test}:93.184.216.34"
    environment:
      CAPTURE_HOST_BRIDGE_IP: ${CAPTURE_HOST_BRIDGE_IP:-172.31.254.1}
      CAPTURE_HOST_BRIDGE_SUBNET: ${CAPTURE_HOST_BRIDGE_SUBNET:-172.31.254.0/29}
      CAPTURE_HOST_BRIDGE_IP_RANGE: ${CAPTURE_HOST_BRIDGE_IP_RANGE:-172.31.254.4/30}
      CAPTURE_PEER_IP: ${CAPTURE_PEER_IP:-172.31.254.3}
      CAPTURE_EGRESS_IP: ${CAPTURE_EGRESS_IP:-172.31.254.2}
    volumes:
      - ./tests/integration/host_bridge_sentinel.py:/probe/host_bridge_sentinel.py:ro
  candidate-private-sentinel:
    image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    profiles: [protected-capture]
    command: [python, /probe/private_network_sentinel.py]
    environment:
      SENTINEL_EVENTS: /state/events.jsonl
      SENTINEL_BIND_HOST: 172.31.253.250
      SENTINEL_EXPECTED_BIND_HOST: 172.31.253.250
      SENTINEL_EXPECTED_SUBNET: 172.31.253.0/24
      CAPTURE_FIXTURE_ORIGIN: "http://${CAPTURE_FIXTURE_HOST:-capture-origin.example.test}"
      CAPTURE_PROBE_MODEL_NAME: ${LLM_MODEL:-local}
    volumes:
      - ./tests/integration/private_network_sentinel.py:/probe/private_network_sentinel.py:ro
      - ./tests/integration/host_bridge_sentinel.py:/probe/host_bridge_sentinel.py:ro
      - ./tests/integration/sentinel_ledger.py:/probe/sentinel_ledger.py:ro
      - ./tests/integration/scraper_ingress_boundary_probe.py:/probe/scraper_ingress_boundary_probe.py:ro
      - candidate_capture_probe_state:/state
    networks:
      candidate_private:
        ipv4_address: 172.31.253.250
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; host=os.environ['SENTINEL_BIND_HOST']; urllib.request.urlopen(f'http://{host}:19001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  candidate-flare-test-origin:
    build:
      context: .
      dockerfile: flare-test-origin/Dockerfile
    image: groktocrawl-x-flare-test-origin:${CANDIDATE_IMAGE_TAG:-dev}
    profiles: [protected-flare]
    environment:
      CAPTURE_FIXTURE_HOST: ${CAPTURE_FIXTURE_HOST:-capture-origin.example.test}
      CAPTURE_PRIVATE_SENTINEL_URL: http://172.31.253.250:19001/probe
    networks:
      candidate_flare_fixture:
        ipv4_address: 93.184.216.34
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  candidate-capture-peer-sentinel:
    image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    profiles: [protected-capture]
    command: [python, /probe/private_network_sentinel.py]
    environment:
      SENTINEL_EVENTS: /state/events.jsonl
      SENTINEL_BIND_HOST: ${CAPTURE_PEER_IP:-172.31.254.3}
      SENTINEL_EXPECTED_BIND_HOST: ${CAPTURE_PEER_IP:-172.31.254.3}
      SENTINEL_EXPECTED_SUBNET: ${CAPTURE_HOST_BRIDGE_SUBNET:-172.31.254.0/29}
    volumes:
      - ./tests/integration/private_network_sentinel.py:/probe/private_network_sentinel.py:ro
      - ./tests/integration/host_bridge_sentinel.py:/probe/host_bridge_sentinel.py:ro
      - candidate_capture_probe_state:/state
    networks:
      candidate_capture:
        ipv4_address: ${CAPTURE_PEER_IP:-172.31.254.3}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; host=os.environ['SENTINEL_BIND_HOST']; urllib.request.urlopen(f'http://{host}:19001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  candidate-host-bridge-sentinel:
    image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    profiles: [protected-capture]
    command: [python, /probe/private_network_sentinel.py]
    environment:
      SENTINEL_EVENTS: /state/events.jsonl
      SENTINEL_POSITIVE_EVENTS: /state/host-bridge-positive-control.jsonl
      SENTINEL_RESERVED_ADDRESSES: ${CAPTURE_EGRESS_IP:-172.31.254.2},${CAPTURE_PEER_IP:-172.31.254.3}
      CAPTURE_HOST_BRIDGE_IP: ${CAPTURE_HOST_BRIDGE_IP:-172.31.254.1}
      CAPTURE_HOST_BRIDGE_SUBNET: ${CAPTURE_HOST_BRIDGE_SUBNET:-172.31.254.0/29}
      CAPTURE_HOST_BRIDGE_IP_RANGE: ${CAPTURE_HOST_BRIDGE_IP_RANGE:-172.31.254.4/30}
      CAPTURE_EGRESS_IP: ${CAPTURE_EGRESS_IP:-172.31.254.2}
      CAPTURE_PEER_IP: ${CAPTURE_PEER_IP:-172.31.254.3}
      SENTINEL_BIND_HOST: ${CAPTURE_HOST_BRIDGE_IP:-172.31.254.1}
      SENTINEL_EXPECTED_BIND_HOST: ${CAPTURE_HOST_BRIDGE_IP:-172.31.254.1}
      SENTINEL_EXPECTED_SUBNET: ${CAPTURE_HOST_BRIDGE_SUBNET:-172.31.254.0/29}
    volumes:
      - ./tests/integration/private_network_sentinel.py:/probe/private_network_sentinel.py:ro
      - ./tests/integration/host_bridge_sentinel.py:/probe/host_bridge_sentinel.py:ro
      - candidate_capture_probe_state:/state
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; host=os.environ['SENTINEL_BIND_HOST']; urllib.request.urlopen(f'http://{host}:19001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

volumes:
  candidate_capture_probe_state:

networks:
  candidate_flare_fixture:
    internal: true
    ipam:
      config:
        - subnet: 93.184.216.32/29

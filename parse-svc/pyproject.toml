[project]
name = "parse-svc"
version = "0.2.0"
description = "GroktoCrawl document parsing service — PDF and office documents to markdown"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "firecrawl-anydoc==0.2.4",
    "pypdf>=5.0.0",
    "tabulate>=0.9.0",
    "pillow>=10.0.0",
]

[tool.deptry.per_rule_ignores]
# Uvicorn is the container entry point. FastAPI loads multipart support dynamically,
# Camelot is an optional enrichment installed separately in the image.
DEP001 = ["camelot"]
DEP002 = ["uvicorn", "python-multipart"]

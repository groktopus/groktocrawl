global
    log stdout format raw local0
    maxconn 128
    stats socket ipv4@127.0.0.1:9999 level admin
    hard-stop-after 75s

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 75s
    timeout server 75s
    timeout queue 5s
    # No automatic replay of expensive POST /scrape calls after failures.
    retries 0

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s
    hold nx 2s
    hold timeout 2s
    hold refused 2s
    hold other 2s

frontend scraper
    bind :8001
    default_backend scrapers

backend scrapers
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    http-check expect rstring "\"status\"[[:space:]]*:[[:space:]]*\"ok\""
    # Close the upstream connection after each response so an API client's
    # long-lived keepalive connection does not pin work to one replica.
    option http-server-close
    server-template scraper 1-4 scraper-svc:8001 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none maxconn 32 maxqueue 32

global
    maxconn 64
    hard-stop-after 10s

defaults
    mode http
    timeout connect 3s
    timeout client 45s
    timeout server 45s
    timeout queue 5s
    retries 0

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s
    hold nx 2s
    hold timeout 2s
    hold refused 2s
    hold other 2s

frontend capture_https
    bind :8443 ssl crt /tmp/capture-server.pem ssl-min-ver TLSv1.2 alpn http/1.1

    acl duplicate_authorization req.hdr_cnt(Authorization) gt 1
    http-request deny deny_status 400 if duplicate_authorization

    acl allowed_bearer req.hdr(Authorization) -m str -f /run/secrets/capture_bearer_acl
    http-request deny deny_status 401 unless allowed_bearer

    acl health_method method GET
    acl health_path path -m str /health
    acl scrape_method method POST
    acl scrape_path path -m str /v2/scrape
    acl request_has_query query -m found
    http-request deny deny_status 404 if request_has_query
    http-request deny deny_status 404 unless health_method health_path or scrape_method scrape_path

    # Do not trust caller-supplied proxy metadata from this public edge.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto

    default_backend candidate_agent_api

backend candidate_agent_api
    server-template agent 1-1 candidate-agent:8080 check resolvers docker resolve-prefer ipv4 init-addr none
